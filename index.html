/* All records use outgoing-message alignment; category does not imply a speaker. */
.entry{margin-left:auto;margin-right:0}
.entry .bubble,.entry.research .bubble,.entry.work .bubble{background:linear-gradient(125deg,#dfdbffed,#d6e7ffed);border-radius:24px 24px 7px 24px}

/* Align by the authenticated author's ID, never by topic or displayed name. */
.entry.incoming{margin-left:0;margin-right:auto}
.entry.incoming .bubble,.entry.incoming.research .bubble,.entry.incoming.work .bubble{background:linear-gradient(125deg,#fff,#ffffffdc);border-radius:24px 24px 24px 7px}

function renderPeople(){const wrap=$('#profileWrap');if(!wrap)return;wrap.hidden=accessRole!=='questioner';const button=$('#profileButton');button.textContent=people.find(p=>p.id===selectedProfile)?.name||'이름 선택';button.onclick=()=>{const open=wrap.classList.toggle('open');button.setAttribute('aria-expanded',String(open))};const popover=$('#profilePopover');popover.innerHTML=people.map(p=>'<button type="button" class="person-tab '+(selectedProfile===p.id?'active':'')+'" style="--person-hue:'+profileColor(p.id)+'" data-pick-person="'+esc(p.id)+'" aria-pressed="'+(selectedProfile===p.id)+'">'+esc(p.name)+'</button>').join('')+'<button type="button" class="profile-add" data-add-person>이름 추가</button>';popover.onclick=e=>{const b=e.target.closest('[data-pick-person]');if(b)selectProfile(b.dataset.pickPerson);if(e.target.closest('[data-add-person]')){wrap.classList.remove('open');settings()}};const filter=$('#personFilter');filter.hidden=!profileFilter;filter.textContent=profileFilter?(people.find(p=>p.id===profileFilter)?.name||'질문자')+' ×':'';filter.onclick=()=>filterPerson('')}

function settings(){modal('이름 선택','<div class="profile-options">'+people.map(p=>'<button class="person-tab '+(selectedProfile===p.id?'active':'')+'" style="--person-hue:'+profileColor(p.id)+'" data-select-profile="'+esc(p.id)+'">'+esc(p.name)+'</button>').join('')+'</div><form id="addProfile"><label class="field">이름<input id="profileName" maxlength="40" autocomplete="off" required></label><div class="dialog-actions"><button class="primary" type="submit">추가</button></div></form>');$('#dialogBody').onclick=e=>{const b=e.target.closest('[data-select-profile]');if(b){selectedProfile=b.dataset.selectProfile;preferences.setItem('scp-profile-'+currentUser.id,selectedProfile);$('#dialog').close();render()}};$('#addProfile').hidden=!['owner','editor','questioner'].includes(accessRole);$('#addProfile').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const p=await window.SCPCloud.addProfile($('#profileName').value);people=people.concat(p).sort((a,b)=>a.name.localeCompare(b.name,'ko'));selectedProfile=p.id;preferences.setItem('scp-profile-'+currentUser.id,selectedProfile);$('#dialog').close();render()}catch(e){toast(e.message)}finally{b.disabled=false}}}

function openExport(){modal('내보내기','<label class="field">범위<select id="exportScope"><option value="visible">현재 보기 ('+visibleNotes().length+'개)</option><option value="all">전체 ('+notes.length+'개)</option></select></label><div class="export-options"><button id="exportHTML">HTML</button><button id="exportExcel">Excel (.xlsx)</button><button id="exportCSV">질문·답변 CSV</button></div>');const selection=()=>$('#exportScope').value==='all'?[...notes].sort((a,b)=>a.createdAt.localeCompare(b.createdAt)):visibleNotes();$('#exportHTML').onclick=()=>{exportHTML(selection());$('#dialog').close()};$('#exportExcel').onclick=()=>{exportExcel(selection());$('#dialog').close()};$('#exportCSV').onclick=()=>{download(encodeCSV(qaRows(selection(),notes)),'text/csv;charset=utf-8','SCP-Toolbox-QA-'+stamp()+'.csv');$('#dialog').close()}}
function download(content,type,name){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function exportHTML(list){const rows=list.map(n=>'<article data-search="'+esc((n.body+' '+n.tags.join(' ')+' '+n.author).toLocaleLowerCase())+'"><div class="meta">'+esc(date(n.createdAt)+' '+time(n.createdAt))+' · '+(categoryLabel(n.category))+(n.author?' · '+esc(n.author):'')+(n.star?' · ★':'')+'</div>'+(n.replyTo?'<blockquote>'+esc(n.replyAuthor||'질문')+'<br>'+esc(n.replyQuestion||notes.find(q=>q.id===n.replyTo)?.body||'원문을 확인할 수 없습니다.')+'</blockquote>':'')+'<div class="body">'+esc(n.body)+'</div><div class="tags">'+n.tags.map(t=>'#'+esc(t)).join(' ')+'</div></article>').join('');download('<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCP LAB Toolbox</title><style>body{font-family:system-ui,sans-serif;background:#f4f3fc;color:#38354c;max-width:740px;margin:auto;padding:35px 20px}h1{text-align:center;font-size:23px;margin:0 0 30px}label{display:flex;gap:12px;align-items:center}input{width:100%;padding:12px;border:1px solid #ded9ef;border-radius:14px;background:#fff;margin:0 0 24px}article{background:#fff;border-radius:20px;padding:22px;margin:18px 0;break-inside:avoid}.meta,.tags{font-size:11px;color:#8b819e}.body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;font-size:14px;margin:12px 0}[hidden]{display:none}@media print{label{display:none}body{background:#fff;padding:0}article{border:1px solid #ddd}}</style><h1>SCP LAB Toolbox</h1><label>⌕<input type="search" aria-label="검색" id="q"></label>'+rows+'<script>document.getElementById("q").addEventListener("input",function(){const q=this.value.toLocaleLowerCase();document.querySelectorAll("article").forEach(a=>a.hidden=!a.dataset.search.includes(q))})<\/script></html>','text/html;charset=utf-8','SCP-Toolbox-'+stamp()+'.html')}
function xml(s){return String(s??'').replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]))}
function exportExcel(list){const headers=['기록 ID','작성일 (KST)','수정일 (KST)','작성자','분류','본문','태그','중요 표시'];const rows=[headers,...list.map(n=>[n.id,date(n.createdAt)+' '+time(n.createdAt),date(n.updatedAt)+' '+time(n.updatedAt),n.author,categoryLabel(n.category),n.body,n.tags.join(', '),n.star?'Y':'N'])];const sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>'+[38,25,25,18,12,90,30,12].map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('')+'</cols><sheetData>'+rows.map((r,i)=>'<row r="'+(i+1)+'">'+r.map((v,j)=>'<c r="'+String.fromCharCode(65+j)+(i+1)+'" t="inlineStr" s="'+(i===0?'1':'0')+'"><is><t xml:space="preserve">'+xml(v)+'</t></is></c>').join('')+'</row>').join('')+'</sheetData><autoFilter ref="A1:H'+rows.length+'"/></worksheet>';
const files={'[Content_Types].xml':'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>','_rels/.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>','xl/workbook.xml':'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="기록" sheetId="1" r:id="rId1"/></sheets></workbook>','xl/_rels/workbook.xml.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>','xl/styles.xml':'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="맑은 고딕"/></font><font><b/><sz val="11"/><name val="맑은 고딕"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE6E1FA"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyAlignment="1" applyFill="1" applyFont="1"><alignment vertical="center" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>','xl/worksheets/sheet1.xml':sheet};download(zip(files),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','SCP-Toolbox-'+stamp()+'.xlsx')}
function zip(files){const enc=new TextEncoder(),chunks=[],central=[];let offset=0;const table=Array.from({length:256},(_,n)=>{for(let i=0;i<8;i++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0});const crc=a=>{let c=0xffffffff;for(const b of a)c=table[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0};const header=(size)=>{const a=new Uint8Array(size),v=new DataView(a.buffer);return{a,u16:(p,n)=>v.setUint16(p,n,true),u32:(p,n)=>v.setUint32(p,n,true)}};for(const [name,value]of Object.entries(files)){const n=enc.encode(name),d=enc.encode(value),c=crc(d),h=header(30);h.u32(0,0x04034b50);h.u16(4,20);h.u32(14,c);h.u32(18,d.length);h.u32(22,d.length);h.u16(26,n.length);chunks.push(h.a,n,d);const z=header(46);z.u32(0,0x02014b50);z.u16(4,20);z.u16(6,20);z.u32(16,c);z.u32(20,d.length);z.u32(24,d.length);z.u16(28,n.length);z.u32(42,offset);central.push(z.a,n);offset+=30+n.length+d.length}const cs=central.reduce((s,a)=>s+a.length,0),end=header(22);end.u32(0,0x06054b50);end.u16(8,Object.keys(files).length);end.u16(10,Object.keys(files).length);end.u32(12,cs);end.u32(16,offset);chunks.push(...central,end.a);const result=new Uint8Array(offset+cs+22);let p=0;for(const a of chunks){result.set(a,p);p+=a.length}return result}
$('#restoreInput').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>20*1024*1024)throw new Error('20MB 이하의 백업 파일을 선택해 주세요.');const data=JSON.parse(await file.text());if(data.format!=='scp-toolbox'||data.version!==1||!Array.isArray(data.notes))throw new Error('SCP LAB Toolbox 백업 파일을 선택해 주세요.');const ids=new Set(notes.map(n=>n.id));const incoming=data.notes.filter(n=>!ids.has(n.id));if(incoming.some(n=>typeof n.body!=='string'||!n.body.trim()||n.body.length>20000||!['research','work','lab','other'].includes(n.category)||!Array.isArray(n.tags)||n.tags.some(t=>typeof t!=='string')||!Number.isFinite(Date.parse(n.createdAt))||!Number.isFinite(Date.parse(n.updatedAt))))throw new Error('백업 데이터 형식을 확인해 주세요.');modal('백업 복원','<p>'+incoming.length+'개를 추가합니다. 같은 ID의 기존 기록은 유지합니다.</p><div class="dialog-actions"><button class="primary" id="confirmRestore" '+(!incoming.length?'disabled':'')+'>복원</button></div>');$('#confirmRestore').onclick=async()=>{const b=$('#confirmRestore');b.disabled=true;let count=0;try{for(const n of incoming){await api('',{method:'POST',body:JSON.stringify({...n,imported:true})});b.textContent=++count+' / '+incoming.length}$('#dialog').close();toast('복원했습니다.')}catch(err){toast(count+'개 복원 후 중단: '+err.message)}finally{await load();b.disabled=false}}}catch(err){toast(err.message)}};
$('#timeline').addEventListener('scroll',()=>$('#jump').hidden=$('#timeline').scrollHeight-$('#timeline').scrollTop-$('#timeline').clientHeight<250);$('#jump').onclick=()=>$('#timeline').scrollTo({top:$('#timeline').scrollHeight,behavior:'smooth'});
try{const draft=JSON.parse(preferences.getItem('scp-draft')||'null');if(draft){manualTags=false;$('#bodyInput').value=draft.body||'';$('#tagInput').value=draft.tags||'';category=draft.category==='work'?'work':'research';if(draft.replyTo)replying={id:draft.replyTo};if(draft.editingId)toast('수정 중이던 글을 새 기록 입력창에 복구했습니다.')}}catch{}resize();window.scpReload=()=>{if(!busy)load()};load(true);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!busy)load()});

function openLogin(){if($('#dialog').open&&$('#loginForm'))return;modal('로그인','<form id="loginForm"><label class="field">아이디<input id="loginUsername" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="40" required></label><label class="field">비밀번호<input id="loginPassword" type="password" autocomplete="current-password" required></label><div class="dialog-actions"><button class="primary" type="submit">로그인</button></div></form>');$('#loginForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await window.SCPCloud.signIn($('#loginUsername').value,$('#loginPassword').value);$('#loginPassword').value='';$('#dialog').close();await load(true)}catch(e){toast(e.message)}finally{b.disabled=false}}}
window.scpAccess=(role,user)=>{accessRole=role;if(currentUser?.id!==user?.id){selectedProfile=user?.id?preferences.getItem('scp-profile-'+user.id):null;profileFilter='';people=[]}currentUser=user||null;author=roleLabel(role);$('footer').hidden=role==='viewer'};
window.scpClearSession=()=>{sessionEpoch++;accessRole=null;currentUser=null;selectedProfile=null;profileFilter="";replying=null;people=[];notes=[];loaded=false;$('.app').hidden=true;$('#menu').hidden=true;$('#entries').innerHTML='';$('#bodyInput').value='';$('#tagInput').value='';editing=null;preferences.removeItem('scp-draft');$('#sendButton').disabled=true;$('#saveState').textContent='로그인 필요'};
$('#dialog').addEventListener('cancel',e=>{if(!loaded)e.preventDefault()});

document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#profileWrap')?.classList.remove('open');$('#profileButton')?.setAttribute('aria-expanded','false')}});

document.addEventListener('click',e=>{if(!e.target.closest('#profileWrap')){$('#profileWrap')?.classList.remove('open');$('#profileButton')?.setAttribute('aria-expanded','false')}});

function changePasswordDialog(){modal('비밀번호 변경','<form id="passwordForm"><label class="field">현재 비밀번호<input id="currentPassword" type="password" autocomplete="current-password" required></label><label class="field">새 비밀번호<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label class="field">새 비밀번호 확인<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><div class="dialog-actions"><button class="primary" type="submit">변경</button></div></form>');$('#passwordForm').onsubmit=async e=>{e.preventDefault();if($('#newPassword').value!==$('#confirmPassword').value){toast('새 비밀번호가 일치하지 않습니다.');return}const b=e.target.querySelector('button');b.disabled=true;try{await window.SCPCloud.changePassword($('#currentPassword').value,$('#newPassword').value);e.target.reset();$('#dialog').close();toast('비밀번호를 변경했습니다.')}catch(e){toast(e.message)}finally{b.disabled=false}}}

function renderReplyBar(){const bar=$('#replyBar');if(!bar)return;bar.hidden=!replying;const q=replying&&(notes.find(n=>n.id===replying.id)||replying);$('#replyLabel').textContent=q?(q.author||'질문')+' · '+(q.body||'').slice(0,100):''}
function startReply(id){if(!['owner','editor'].includes(accessRole))return;const q=notes.find(n=>n.id===id);if(!q||!isQuestion(q))return;if(editing){toast('수정 중인 글을 먼저 저장해 주세요.');return}replying=q;renderReplyBar();storeDraft();$('#bodyInput').focus()}
function replyQuote(n){if(!n.replyTo)return '';const q=notes.find(q=>q.id===n.replyTo);return '<button class="reply-quote" data-open-question="'+esc(n.replyTo)+'" title="원래 질문 보기">'+esc(n.replyAuthor||q?.author||'질문')+'<span>'+esc((n.replyQuestion||q?.body||'원문을 확인할 수 없습니다.').slice(0,200))+'</span></button>'}
function openQuestion(id){if(!notes.some(n=>n.id===id)){toast('삭제된 질문입니다. 인용 내용으로 확인해 주세요.');return}filter='all';profileFilter='';tagFilter='';$('#searchInput').value='';$$('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));render();requestAnimationFrame(()=>document.getElementById('note-'+id)?.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'}))}
$('#cancelReply').onclick=()=>{replying=null;renderReplyBar();storeDraft()};
